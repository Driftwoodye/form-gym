.15em;color:var(--pink2);text-transform:uppercase}.poster h2{font:900 clamp(37px,9vw,64px)/.9 Impact,'Arial Black',sans-serif;text-transform:uppercase;color:var(--pink);text-shadow:2px 3px #5d102b;margin:15px 0;max-width:570px}.poster p{line-height:1.5;color:#e3cdd5;max-width:520px;font-size:13px}.btn{border:1px solid var(--pink);background:var(--pink);color:#18060c;font:900 14px Impact,'Arial Black',sans-serif;letter-spacing:.03em;text-transform:uppercase;padding:13px 16px;border-radius:6px;min-height:44px}.btn.secondary{background:#1b1118;color:#ffd6e0;border-color:#704054}.btn.ghost{background:transparent;color:#d6a6b7;border-color:#573044}.btn.full{width:100%}.btn.small{min-height:33px;padding:7px 10px;font-size:12px}.card{border:1px solid #523344;background:linear-gradient(145deg,#191218,#100c10);border-radius:12px;padding:16px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.muted{color:var(--muted);font-size:12px;line-height:1.5}.section{font:900 22px Impact,'Arial Black',sans-serif;text-transform:uppercase;margin:23px 0 11px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#100b0f;border:1px solid var(--line);border-radius:10px;padding:12px 10px;min-width:0}.stat b{display:block;font:28px Impact,'Arial Black',sans-serif;color:var(--pink2);overflow-wrap:anywhere}.stat span{font-size:10px;color:var(--muted)}.progress{height:8px;background:#34232d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff174f,#ff759d);border-radius:9px}.list{display:grid;gap:9px}.item{border:1px solid var(--line);background:#120d11;border-radius:10px;padding:12px}.item h3{font-size:15px;margin:0 0 4px}.item p{margin:0}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11px;color:var(--muted);font-weight:750}.field input,.field select{width:100%;min-width:0;background:#0b080a;border:1px solid #4c3340;border-radius:8px;padding:11px;color:var(--white)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 14px;padding-bottom:3px}.tabs button{border:1px solid var(--line);border-radius:7px;background:#171016;color:var(--muted);padding:9px 12px;white-space:nowrap;font-weight:800;font-size:12px}.tabs button.active{background:var(--pink);border-color:var(--pink);color:#18060c}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#0d080cee;border-top:1px solid #5a263d;backdrop-filter:blur(18px);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.nav button{background:transparent;border:0;color:#aa8d9a;padding:5px 0;font-size:10px;font-weight:800;display:grid;justify-items:center;gap:3px}.nav button span:first-child{font-size:19px}.nav button.active{color:var(--pink2)}.setrow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 40px;align-items:center;gap:6px;margin:7px 0}.setrow input{width:100%;min-width:0;text-align:center;padding:10px 3px;background:#0b080a;border:1px solid #4c3340;border-radius:7px;color:white}.setrow .num{text-align:center;color:var(--muted);font-size:12px}.check{width:38px;height:38px;border:1px solid #573748;border-radius:50%;background:#21151d;color:#d6bdc7;font-weight:900}.check.done{background:var(--pink);color:#18060c;border-color:var(--pink)}.notice{background:#ff245d0d;border:1px solid #6c2c45;color:#e7d1d9;padding:12px;border-radius:9px;font-size:12px;line-height:1.5}.notice b{color:var(--pink2)}canvas{width:100%;height:180px;display:block}.pill{font-size:10px;border:1px solid #85334f;color:#ff8eae;background:#ff245d18;border-radius:4px;padding:5px 7px}.empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:13px}.hr{border:0;border-top:1px solid #382531;margin:14px 0}.hide{display:none!important}@media(min-width:65 <script>
'use strict';
const KEY='repzilla_v2_data';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
const defaults=[
{name:'Upper Body A',exercises:[['Bench Press',4,8],['Lat Pulldown',3,10],['Incline Dumbbell Press',3,10],['Seated Cable Row',3,10],['Lateral Raise',3,12],['Triceps Pushdown',3,12]]},
{name:'Lower Body A',exercises:[['Squat',4,8],['Romanian Deadlift',3,10],['Leg Press',3,10],['Leg Curl',3,12],['Calf Raise',3,15],['Plank',3,45]]},
{name:'Upper Body B',exercises:[['Overhead Press',3,8],['Pull-up / Assisted Pull-up',3,8],['Chest-Supported Row',3,10],['Chest Fly',3,12],['Biceps Curl',3,12],['Face Pull',3,15]]},
{name:'Lower Body B',exercises:[['Deadlift',3,5],['Bulgarian Split Squat',3,10],['Hip Thrust',3,10],['Leg Extension',3,12],['Hamstring Curl',3,12],['Hanging Knee Raise',3,12]]}
];
function fresh(){return {version:2,createdAt:new Date().toISOString(),plans:defaults.map((p,i)=>({id:'p'+i,name:p.name,exercises:p.exercises.map((e,j)=>({id:'e'+i+'-'+j,name:e[0],sets:e[1],target:e[2]}))})),sessions:[],cardio:[],measurements:[],goals:[],customExercises:[],settings:{unit:'kg'},activePlan:0};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===2)return {...fresh(),...x}}catch(e){}return fresh()}
let db=load(),page='today',activeSession=null,cardioKind='Run';
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function dateLabel(d=iso()){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function startSession(planIndex=db.activePlan){const p=db.plans[planIndex]||db.plans[0];activeSession={id:uid(),date:iso(),planId:p.id,planName:p.name,startedAt:Date.now(),exercises:p.exercises.map(e=>({exerciseId:e.id,name:e.name,sets:Array.from({length:Math.max(1,Number(e.sets)||3)},()=>({weight:'',reps:String(e.target||8),done:false}))}))};page='train';render()}
function sessionStats(s){let sets=0,volume=0;for(const e of s.exercises||[])for(const x of e.sets||[])if(x.done){sets++;volume+=(Number(x.weight)||0)*(Number(x.reps)||0)}return {sets,volume,exercises:(s.exercises||[]).filter(e=>e.sets.some(x=>x.done)).length}}
function finishSession(){if(!activeSession)return;const st=sessionStats(activeSession);if(!st.sets&&!confirm('No sets marked complete. Save this workout anyway?'))return;activeSession.endedAt=Date.now();activeSession.duration=Math.max(1,Math.round((activeSession.endedAt-activeSession.startedAt)/60000));db.sessions.unshift(activeSession);save();activeSession=null;page='complete';render()}
function go(p){page=p;render()}
function button(text,act,cls='btn'){return '<button class="'+cls+'" data-act="'+act+'">'+text+'</button>'}
function cardioMinutes(){return db.cardio.reduce((a,c)=>a+(Number(c.minutes)||0),0)}
function renderNav(){const items=[['today','⌂','Today'],['plans','✣','Workouts'],['cardio','↗','Cardio'],['progress','▥','Progress'],['more','☷','More']];$('#nav').innerHTML=items.map(([id,icon,t])=>'<button data-page="'+id+'" class="'+(page===id?'active':'')+'"><span>'+icon+'</span><span>'+t+'</span></button>').join('')}
function render(){
 $('#todayDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
 renderNav();const root=$('#app');
 if(page==='today')root.innerHTML=home();
 else if(page==='plans')root.innerHTML=plansPage();
 else if(page==='train')root.innerHTML=trainPage();
 else if(page==='complete')root.innerHTML=completePage();
 else if(page==='cardio')root.innerHTML=cardioPage();
 else if(page==='progress')root.innerHTML=progressPage();
 else if(page==='history')root.innerHTML=historyPage();
 else if(page==='goals')root.innerHTML=goalsPage();
 else if(page==='more')root.innerHTML=morePage();
 else if(page==='settings')root.innerHTML=settingsPage();
 else root.innerHTML=home();
}

function trainPage(){if(!activeSession)return '<div class="poster"><div class="eyebrow">The experiment begins</div><h2>Ready for your close-up?</h2><p>Choose a workout plan to start logging sets.</p>'+button('Choose workout','plans','btn full')+'</div>';const st=sessionStats(activeSession),total=activeSession.exercises.reduce((a,e)=>a+e.sets.length,0);return '<div class="row"><div><div class="eyebrow">Now performing</div><div class="section" style="margin:5px 0">'+esc(activeSession.planName)+'</div><div class="muted">'+st.sets+' / '+total+' sets complete</div></div>'+button('Finish','finish','btn small')+'</div><div class="progress" style="margin:14px 0 18px"><i style="width:'+Math.round(st.sets/Math.max(1,total)*100)+'%"></i></div>'+activeSession.exercises.map((e,ei)=>'<div class="card"><div class="row"><div><h3>'+esc(e.name)+'</h3><p class="muted">'+e.sets.length+' sets · weight in '+esc(db.settings.unit||'kg')+'</p></div>'+button('+ set','addset:'+ei,'btn secondary small')+'</div><div class="setrow" style="font-size:10px;color:var(--muted);text-align:center"><span>SET</span><span>WEIGHT ('+esc(db.settings.unit||'kg')+')</span><span>REPS</span><span>✓</span></div>'+e.sets.map((x,si)=>'<div class="setrow"><span class="num">'+(si+1)+'</span><input type="number" min="0" step="0.5" placeholder="0" aria-label="Weight" data-setweight="'+ei+':'+si+'" value="'+esc(x.weight)+'"><input type="number" min="0" step="1" placeholder="8" aria-label="Reps" data-setreps="'+ei+':'+si+'" value="'+esc(x.reps)+'"><button class="check '+(x.done?'done':'')+'" data-act="toggle:'+ei+':'+si+'" aria-label="Mark set complete">'+(x.done?'✓':'○')+'</button></div>').join('')+'</div>').join('')+'<div class="row wrap">'+button('Add exercise','sessionaddex','btn secondary')+button('Finish workout','finish','btn full')+'</div>'}
function completePage(){const s=db.sessions[0];if(!s)return home();const st=sessionStats(s);return '<section class="poster" style="text-align:center"><div class="eyebrow">The experiment continues</div><h2 style="font-size:clamp(38px,10vw,60px)">Workout complete!</h2><p>Another step towards your final form. You are still a work in progress. How delicious.</p></section><div class="stats"><div class="stat"><b>'+st.exercises+'</b><span>Exercises</span></div><div class="stat"><b>'+st.sets+'</b><span>Sets</span></div><div class="stat"><b>'+Math.round(st.volume).toLocaleString()+'</b><span>'+esc(db.settings.unit)+' total volume</span></div></div><div class="card" style="margin-top:12px"><p class="muted">'+dateLabel(s.date)+' · '+(s.duration||1)+' minutes</p>'+button('On to the next experiment','today','btn full')+button('View workout history','history','btn secondary full')+'</div>'}
function cardioPage(){return '<div class="eyebrow">Run, walk, ride, repeat</div><div class="section">Cardio lab</div><div class="tabs">'+['Run','Walk','Cycle','Other'].map(k=>'<button data-cardio-kind="'+k+'" class="'+(cardioKind===k?'active':'')+'">'+k+'</button>').join('')+'</div><div class="card"><div class="grid2"><div class="field"><label>Distance (km)</label><input id="cdist" type="number" min="0" step=".01" placeholder="5.00"></div><div class="field"><label>Duration (minutes)</label><input id="cmins" type="number" min="0" step=".1" placeholder="28.5"></div><div class="field"><label>Average heart rate (optional)</label><input id="chr" type="number" min="0" placeholder="145"></div><div class="field"><label>Date</label><input id="cdate" type="date" value="'+iso()+'"></div></div><div class="field" style="margin-top:10px"><label>Notes (optional)</label><input id="cnote" placeholder="Route, effort, weather…"></div><button class="btn full" data-act="savecardio" style="margin-top:13px">Save cardio session</button></div><div class="section">Recent cardio</div>'+(db.cardio.length?'<div class="list">'+db.cardio.slice(0,30).map(c=>'<div class="item"><div class="row"><div><h3>'+esc(c.type)+' · '+Number(c.distance||0).toFixed(2)+' km</h3><p class="muted">'+dateLabel(c.date)+' · '+Number(c.minutes||0)+' min'+(c.hr?' · '+c.hr+' bpm':'')+'</p>'+(c.note?'<p class="muted">'+esc(c.note)+'</p>':'')+'</div>'+button('×','delcardio:'+c.id,'btn ghost small')+'</div></div>').join('')+'</div>':'<div class="card empty">Your first cardio log is waiting.</div>')}
function progressPage(){const sessions=db.sessions;const volume=sessions.map(s=>({date:s.date,v:sessionStats(s).volume})).reverse();const totalVol=sessions.reduce((a,s)=>a+sessionStats(s).volume,0);const totalSets=sessions.reduce((a,s)=>a+sessionStats(s).sets,0);const best={};sessions.forEach(s=>(s.exercises||[]).forEach(e=>(e.sets||[]).filter(x=>x.done).forEach(x=>{const w=Number(x.weight)||0;if(!best[e.name]||w>best[e.name].weight)best[e.name]={weight:w,reps:Number(x.reps)||0,date:s.date}})));return '<div class="eyebrow">A beautiful kind of madness</div><div class="section">Progress & personal records</div><div class="stats"><div class="stat"><b>'+sessions.length+'</b><span>Workouts</span></div><div class="stat"><b>'+totalSets+'</b><span>Sets completed</span></div><div class="stat"><b>'+Math.round(totalVol).toLocaleString()+'</b><span>Total volume · '+esc(db.settings.unit)+'</span></div></div><div class="section">Session volume</div><div class="card">'+(volume.length?'<canvas id="volchart" width="700" height="180"></canvas>':'<div class="empty">Log a workout to see your progress chart.</div>')+'</div><div class="section">Personal records</div>'+(Object.keys(best).length?'<div class="list">'+Object.entries(best).sort((a,b)=>b[1].weight-a[1].weight).map(([n,v])=>'<div class="item row"><div><b>'+esc(n)+'</b><p class="muted">'+v.weight+' '+esc(db.settings.unit)+' × '+v.reps+' reps · '+dateLabel(v.date)+'</p></div><span class="pill">BEST</span></div>').join('')+'</div>':'<div class="card empty">Your records will appear as you log completed sets.</div>')+'<div class="section">Body measurements</div><div class="card"><div class="grid2"><div class="field"><label>Date</label><input type="date" id="mdate" value="'+iso()+'"></div><div class="field"><label>Weight (kg)</label><input id="mweight" type="number" step=".1" placeholder="63.2"></div><div class="field"><label>Body fat % (optional)</label><input id="mbf" type="number" step=".1" placeholder="18.5"></div><div class="field"><label>Waist (cm, optional)</label><input id="mwaist" type="number" step=".1" placeholder="80"></div></div><button class="btn full" data-act="savemeasure" style="margin-top:12px">Save measurement</button></div>'+(db.measurements.length?'<div class="list">'+db.measurements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(m=>'<div class="item"><b>'+dateLabel(m.date)+'</b><p class="muted">'+(m.weight?m.weight+' kg':'')+(m.bodyfat?' · '+m.bodyfat+'% body fat':'')+(m.waist?' · '+m.waist+' cm waist':'')+'</p></div>').join('')+'</div>':'')}
function historyPage(){return '<div class="eyebrow">Your body of work</div><div class="section">Workout history</div>'+(db.sessions.length?'<div class="list">'+db.sessions.map(s=>{const st=sessionStats(s);return '<div class="card"><div class="row"><div><h3>'+esc(s.planName)+'</h3><p class="muted">'+dateLabel(s.date)+' · '+(s.duration||'—')+' min</p><p class="muted">'+st.exercises+' exercises · '+st.sets+' sets · '+Math.round(st.volume).toLocaleString()+' '+esc(db.settings.unit)+' volume</p></div>'+button('Delete','delsession:'+s.id,'btn ghost small')+'</div><details style="margin-top:12px"><summary class="muted">Show exercises</summary>'+s.exercises.map(e=>'<p class="muted">'+esc(e.name)+': '+e.sets.filter(x=>x.done).map(x=>esc(x.weight)+' × '+esc(x.reps)).join(', ')+'</p>').join('')+'</details></div>'}).join('')+'</div>':'<div class="card empty">No workouts saved yet.</div>')}
function morePage(){return '<div class="eyebrow">Behind the curtain</div><div class="section">Repzilla menu</div><div class="list"><div class="card row"><div><h3>Workout history</h3><p class="muted">Review sessions and completed sets.</p></div>'+button('Open','history','btn secondary small')+'</div><div class="card row"><div><h3>Goals & achievements</h3><p class="muted">Your next milestones.</p></div>'+button('Open','goals','btn secondary small')+'</div><div class="card row"><div><h3>Backup & migration</h3><p class="muted">Export your data or import an old Repzilla/Form backup.</p></div>'+button('Open','settings','btn secondary small')+'</div><div class="card row"><div><h3>Settings</h3><p class="muted">Units and app preferences.</p></div>'+button('Open','settings','btn secondary small')+'</div></div><div class="poster"><div class="eyebrow">Your new mantra</div><h2>Don't dream it. Train it.</h2><p>Progress is a kind of beautiful madness.</p></div>'}
function settingsPage(){return '<div class="eyebrow">Keep your records safe</div><div class="section">Settings & data</div><div class="card"><div class="field"><label>Weight unit</label><select id="unit"><option '+(db.settings.unit==='kg'?'selected':'')+'>kg</option><option '+(db.settings.unit==='lb'?'selected':'')+'>lb</option></select></div><button class="btn full" data-act="saveunit" style="margin-top:12px">Save settings</button></div><div class="card"><h3>Backup your data</h3><p class="muted">Downloads workouts, plans, cardio, measurements and settings as JSON.</p>'+button('Download JSON backup','backup','btn full')+'<hr class="hr"><button class="btn secondary full" data-act="exportcsv">Export workout history as CSV</button></div><div class="card"><h3>Import existing app data</h3><p class="muted">Choose a JSON backup from your previous Form/Repzilla app. Import adds compatible history and keeps a copy of your current Repzilla data first.</p><label class="btn secondary full" for="importfile" style="text-align:center">Choose JSON backup</label><input id="importfile" type="file" accept=".json,application/json" class="hide"><div id="importmsg" class="muted" style="margin-top:10px"></div></div><div class="notice"><b>Important:</b> This is a new app origin/path, so it cannot automatically read the old app's browser storage. Export a backup in the old app first, then import it here. Never clear the old app's data until you have checked the imported history.</div><div class="card" style="margin-top:12px"><h3>Reset Repzilla</h3><p class="muted">This removes data stored in this new app only.</p>'+button('Reset new app data','reset','btn ghost full')+'</div>'}
function goalsPage(){return '<div class="eyebrow">The final form</div><div class="section">Goals & achievements</div><div class="card"><h3>Set a goal</h3><div class="grid2"><div class="field"><label>Goal</label><input id="goalname" placeholder="e.g. Run 5 km"></div><div class="field"><label>Target date</label><input id="goaldate" type="date"></div></div><button class="btn full" data-act="addgoal" style="margin-top:12px">Add goal</button></div><div class="section">Your milestones</div><div class="list">'+(db.goals.length?db.goals.map(g=>'<div class="item row"><div><b>'+esc(g.name)+'</b><p class="muted">'+(g.date?dateLabel(g.date):'No target date')+'</p></div>'+button(g.done?'Completed':'Mark done','goal:'+g.id,'btn secondary small')+'</div>').join(''):'<div class="card empty">Every legend starts with one goal.</div>')+'</div><div class="section">Unlocked</div><div class="list">'+[['First Night',db.sessions.length>=1,'Log your first workout'],['Creature of Habit',db.sessions.length>=7,'Log 7 workouts'],['Time Warp',db.cardio.length>=1,'Log your first cardio session'],['Sweet Transvestite',db.sessions.length>=10,'Log 10 workouts'],['The Final Form',db.sessions.length>=25,'Log 25 workouts']].map(([n,yes,d])=>'<div class="item row"><div><b>'+esc(n)+'</b><p class="muted">'+esc(d)+'</p></div><span class="pill">'+(yes?'UNLOCKED':'LOCKED')+'</span></div>').join('')+'</div>'}
function drawChart(){const c=$('#volchart');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const vals=db.sessions.slice(0,12).reverse().map(s=>sessionStats(s).volume),max=Math.max(1,...vals);ctx.strokeStyle='#49303d';ctx.fillStyle='#c0a9b4';ctx.font='12px system-ui';for(let i=0;i<4;i++){const y=10+(h-35)*i/3;ctx.beginPath();ctx.moveTo(32,y);ctx.lineTo(w-5,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/3)).toString(),2,y+4)}const bw=Math.max(5,(w-45)/Math.max(1,vals.length)*.62),gap=(w-45)/Math.max(1,vals.length);vals.forEach((v,i)=>{const bh=(h-45)*v/max;ctx.fillStyle='#ff245d';ctx.fillRect(35+i*gap,h-22-bh,bw,bh)})}
function backup(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'Repzilla'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='repzilla-backup-'+iso()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(obj){let count=0;const source=obj.data&&typeof obj.data==='object'?obj.data:obj;const sessions=source.sessions||source.workouts||source.history||[];if(Array.isArray(sessions)){for(const s of sessions){if(!s||typeof s!=='object')continue;const normalized={...s,id:s.id||uid(),date:String(s.date||s.startedAt||iso()).slice(0,10),planName:s.planName||s.name||s.workoutName||'Imported workout',exercises:Array.isArray(s.exercises)?s.exercises.map(e=>({name:e.name||e.exerciseName||'Exercise',sets:(Array.isArray(e.sets)?e.sets:[]).map(x=>({weight:x.weight??x.kg??'',reps:x.reps??x.repetitions??'',done:x.done??x.completed??true}))})):[]};if(!db.sessions.some(old=>old.id===normalized.id&&old.date===normalized.date)) {db.sessions.push(normalized);count++}}}
const cardio=source.cardio||source.cardioSessions||[];if(Array.isArray(cardio))for(const c of cardio){if(!c||typeof c!=='object')continue;db.cardio.push({id:uid(),date:String(c.date||iso()).slice(0,10),type:c.type||c.activity||'Other',distance:Number(c.distance||c.distanceKm||0),minutes:Number(c.minutes||c.duration||0),hr:c.hr||c.heartRate||'',note:c.note||c.notes||''});count++}
const measurements=source.measurements||source.bodyMeasurements||[];if(Array.isArray(measurements))for(const m of measurements){if(m&&typeof m==='object'){db.measurements.push({date:String(m.date||iso()).slice(0,10),weight:m.weight??m.bodyWeight??'',bodyfat:m.bodyfat??m.bodyFat??'',waist:m.waist??''});count++}}
if(Array.isArray(source.plans)&&source.plans.length){const names=new Set(db.plans.map(p=>p.name));source.plans.forEach((p,i)=>{if(p&&p.name&&!names.has(p.name)){db.plans.push({id:uid(),name:p.name,exercises:(p.exercises||[]).map(e=>({id:uid(),name:e.name||e.exerciseName||'Exercise',sets:e.setsCount||e.sets||3,target:e.target||e.reps||8}))});names.add(p.name)}})}
save();return count}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}const ck=e.target.closest('[data-cardio-kind]');if(ck){cardioKind=ck.dataset.cardioKind;render();return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='start'){startSession();return}if(a.startsWith('start:')){startSession(Number(a.split(':')[1]));return}if(['today','plans','train','cardio','progress','history','more','settings'].includes(a)){go(a);return}if(a==='goals'){go('goals');return}if(a==='finish'){finishSession();return}
if(a.startsWith('toggle:')){const[,ei,si]=a.split(':');const x=activeSession.exercises[+ei].sets[+si];x.done=!x.done;save();render();return}
if(a.startsWith('addset:')){const ei=+a.split(':')[1];activeSession.exercises[ei].sets.push({weight:'',reps:'8',done:false});save();render();return}
if(a==='sessionaddex'){const name=prompt('Exercise name?');if(name&&name.trim()){activeSession.exercises.push({name:name.trim(),sets:[{weight:'',reps:'8',done:false},{weight:'',reps:'8',done:false},{weight:'',reps:'8',done:false}]});save();render()}return}
if(a.startsWith('addex:')){const i=+a.split(':')[1],name=prompt('Exercise name?');if(name&&name.trim()){db.plans[i].exercises.push({id:uid(),name:name.trim(),sets:3,target:8});save();render()}return}
if(a.startsWith('editex:')){const[,i,id]=a.split(':'),ex=db.plans[+i].exercises.find(x=>x.id===id);if(!ex)return;const n=prompt('Exercise name',ex.name);if(n===null)return;const sets=prompt('Number of sets',ex.sets);if(sets===null)return;ex.name=n.trim()||ex.name;ex.sets=Math.max(1,Math.min(12,+sets||3));save();render();return}
if(a.startsWith('rename:')){const i=+a.split(':')[1],n=prompt('Workout plan name',db.plans[i].name);if(n&&n.trim()){db.plans[i].name=n.trim();save();render()}return}
if(a==='newplan'){const n=prompt('Name for the new workout plan');if(n&&n.trim()){db.plans.push({id:uid(),name:n.trim(),exercises:[]});db.activePlan=db.plans.length-1;save();render()}return}
if(a==='savecardio'){const distance=+$('#cdist').value,minutes=+$('#cmins').value;if(!Number.isFinite(distance)||distance<0||!Number.isFinite(minutes)||minutes<=0){alert('Enter a valid duration and distance.');return}db.cardio.unshift({id:uid(),date:$('#cdate').value||iso(),type:cardioKind,distance,minutes,hr:$('#chr').value||'',note:$('#cnote').value||''});save();render();return}
if(a.startsWith('delcardio:')){if(confirm('Delete this cardio record?')){db.cardio=db.cardio.filter(c=>c.id!==a.split(':')[1]);save();render()}return}
if(a==='savemeasure'){const m={date:$('#mdate').value||iso(),weight:$('#mweight').value,bodyfat:$('#mbf').value,waist:$('#mwaist').value};if(!m.weight&&!m.bodyfat&&!m.waist){alert('Enter at least one measurement.');return}db.measurements.push(m);save();render();return}
if(a==='backup'){backup();return}if(a==='exportcsv'){const rows=[['Date','Workout','Exercise','Set','Weight','Reps','Completed']];db.sessions.forEach(s=>(s.exercises||[]).forEach(ex=>(ex.sets||[]).forEach((x,i)=>rows.push([s.date,s.planName,ex.name,i+1,x.weight,x.reps,x.done]))));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='repzilla-workouts.csv';a.click();return}
if(a==='saveunit'){db.settings.unit=$('#unit').value;save();render();return}
if(a==='reset'){if(confirm('Delete all data stored in Repzilla on this device? Export a backup first if unsure.')){db=fresh();save();activeSession=null;go('today')}return}
if(a==='addgoal'){const n=$('#goalname').value.trim();if(n){db.goals.push({id:uid(),name:n,date:$('#goaldate').value,done:false});save();render()}return}
if(a.startsWith('goal:')){const g=db.goals.find(g=>g.id===a.split(':')[1]);if(g){g.done=!g.done;save();render()}return}
if(a.startsWith('delsession:')){if(confirm('Delete this workout from Repzilla?')){db.sessions=db.sessions.filter(s=>s.id!==a.split(':')[1]);save();render()}return}
});
document.addEventListener('input',e=>{if(!activeSession)return;const w=e.target.dataset.setweight,r=e.target.dataset.setreps;if(w){const [ei,si]=w.split(':');activeSession.exercises[+ei].sets[+si].weight=e.target.value;save()}if(r){const [ei,si]=r.split(':');activeSession.exercises[+ei].sets[+si].reps=e.target.value;save()}});
document.addEventListener('change',async e=>{if(e.target.id==='unit'){return}if(e.target.id==='importfile'){const file=e.target.files[0];if(!file)return;try{const text=await file.text(),obj=JSON.parse(text);const backupNow={...db};localStorage.setItem('repzilla_v2_preimport_backup',JSON.stringify(backupNow));const n=importData(obj);$('#importmsg').textContent='Imported '+n+' compatible records. Review Workout History, Cardio and Progress before relying on this copy.';alert('Import finished. '+n+' compatible records were added. Some older app formats may need a format-specific migration if totals do not match.');go('history')}catch(err){alert('Could not import that JSON file. Your current Repzilla data was not intentionally cleared. Check that the file is valid JSON.')}e.target.value=''}});
const _render=render;render=function(){_render();if(page==='progress')drawChart()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
save();render();
</script></body></html>
