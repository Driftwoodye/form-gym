function dateISO(dt=new Date()){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function parseDate(str){const [y,m,d]=str.split('-').map(Number);return new Date(y,m-1,d,12,0,0)}
function weekday(str=dateISO()){return (parseDate(str).getDay()+6)%7}
function monday(str=dateISO()){let d=parseDate(str);d.setDate(d.getDate()-weekday(str));return dateISO(d)}
function offsetDate(str,n){let d=parseDate(str);d.setDate(d.getDate()+n);return dateISO(d)}
function formattedDate(str){return parseDate(str).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function escapeHtml(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return (globalThis.crypto?.randomUUID?.()||String(Date.now())+'_'+Math.random().toString(36).slice(2))}

function bestWeight(id){const values=data.sessions.flatMap(s=>s.exercises.filter(e=>e.id===id).flatMap(e=>e.sets.filter(t=>t.done&&t.kg!==''&&Number(t.kg)>0).map(t=>Number(t.kg))));return values.length?Math.max(...values):null}
function recentWeight(id){const f=lastCompletedExercise(id);if(!f)return null;const match=f.sets.find(x=>x.done&&x.kg!=='');return match?Number(match.kg):null}
function drawLineChart(items,field){const clean=items.filter(x=>x[field]!==''&&Number.isFinite(Number(x[field]))).slice(-15);if(!clean.length)return `<div class="empty">Add two or more body check-ins to see your trend here.</div>`;if(clean.length===1)return `<div class="empty">Latest: ${Number(clean[0][field]).toFixed(1)} ${field==='weight'?'kg':'cm'}. Add another check-in to see your trend.</div>`;const vals=clean.map(x=>Number(x[field]));const low=Math.min(...vals),high=Math.max(...vals),rng=Math.max(1,high-low),mn=low-rng*.18,mx=high+rng*.18;const points=clean.map((x,i)=>[30+(i/(clean.length-1))*270,145-((Number(x[field])-mn)/(mx-mn))*120]);return `<svg class="chart" viewBox="0 0 330 165" role="img" aria-label="Trend graph ${field}"><path class="axis" d="M30 24H302M30 85H302M30 145H302"/><text x="0" y="29">${mx.toFixed(1)}</text><text x="0" y="149">${mn.toFixed(1)}</text><polyline class="plot" points="${points.map(p=>p.join(',')).join(' ')}"/>${points.map(p=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}<text x="30" y="163">${clean[0].date.slice(5)}</text><text x="254" y="163">${clean.at(-1).date.slice(5)}</text></svg>`}
function renderExtras(){
const cardio=[...data.cardio].reverse();
const custom=[...data.customWorkouts];
main.innerHTML=header('Your training, your way','Log cardio, build custom workouts, and add sets when your session needs them.','Training tools')+
'<div class="sectionline"><h2>Log cardio</h2></div><div class="card"><form id="cardioForm" class="stack"><div><label class="fieldlabel" for="cardioType">Activity</label><select class="inputfield" id="cardioType" name="type"><option>Running</option><option>Walking</option><option>Cycling</option><option>Elliptical</option><option>Rowing</option><option>Swimming</option><option>Other</option></select></div><div class="twocol"><div><label class="fieldlabel" for="cardioDate">Date</label><input class="inputfield" id="cardioDate" name="date" type="date" value="${dateISO()}" required></div><div><label class="fieldlabel" for="cardioMinutes">Duration (min)</label><input class="inputfield" id="cardioMinutes" name="minutes" type="number" min="1" max="1440" required placeholder="30"></div><div><label class="fieldlabel" for="cardioDistance">Distance (km, optional)</label><input class="inputfield" id="cardioDistance" name="distance" type="number" min="0" step="0.01" placeholder="5.0"></div><div><label class="fieldlabel" for="cardioEffort">Effort</label><select class="inputfield" id="cardioEffort" name="effort"><option>Easy</option><option>Moderate</option><option>Hard</option></select></div></div><div><label class="fieldlabel" for="cardioNotes">Notes (optional)</label><input class="inputfield" id="cardioNotes" name="notes" placeholder="Route, pace, how it felt"></div><button class="btn block" type="submit">Save cardio session</button></form></div>'+
'<div class="sectionline"><h2>Custom workouts</h2></div><div class="card"><form id="customForm" class="stack"><div><label class="fieldlabel" for="customName">Workout name</label><input class="inputfield" id="customName" name="name" required maxlength="80" placeholder="e.g. Home dumbbell session"></div><div><label class="fieldlabel" for="customExercises">Exercises (one per line)</label><textarea class="inputfield" id="customExercises" name="exercises" rows="4" required placeholder="Dumbbell row\nPush-ups\nGoblet squat"></textarea></div><button class="btn block" type="submit">Save custom workout</button></form></div>'+
(custom.length?custom.map((w,i)=>'<div class="record"><div class="row start"><div><h3>'+escapeHtml(w.name)+'</h3><div class="small">'+w.exercises.length+' exercises · saved on this device</div></div><div class="row"><button class="btn tiny" data-start-custom="'+escapeHtml(w.id)+'">Start</button><button class="btn tiny ghost" data-delete-custom="'+i+'">Delete</button></div></div><ul class="small">'+w.exercises.map(e=>'<li>'+escapeHtml(e)+'</li>').join('')+'</ul></div>').join(''):'<div class="empty">Your custom workouts will appear here.</div>')+
'<div class="sectionline"><h2>Cardio history</h2></div>'+(cardio.length?cardio.map(c=>'<div class="record"><div class="row start"><div><div class="eyebrow">'+escapeHtml(c.date)+'</div><h3>'+escapeHtml(c.type)+' · '+escapeHtml(c.minutes)+' min</h3><div class="small">'+(c.distance?escapeHtml(c.distance)+' km · ':'')+escapeHtml(c.effort)+(c.notes?' · '+escapeHtml(c.notes):'')+'</div></div><button class="btn tiny ghost" data-delete-cardio="'+escapeHtml(c.id)+'">Delete</button></div></div>').join(''):'<div class="empty">No cardio sessions logged yet.</div>')+
'<p class="small">These entries are stored locally in this browser, alongside your existing FORM data. Export a JSON backup from Progress regularly.</p>';
}
function renderProgress(){const sorted=[...data.measurements].sort((a,b)=>a.date.localeCompare(b.date));const latest=sorted.at(-1);const keyIds=['incline_db','incline_curl','cable_curl','hammer_curl','lateral_raise','leg_press'];main.innerHTML=header('Visible progress','Track your weight, waist and arms — plus the strength that builds muscle.','Body transformation')+`<div class="statgrid"><div class="stat"><strong>${latest?.weight?escapeHtml(latest.weight):'—'}</strong><span>Body kg</span></div><div class="stat"><strong>${latest?.arm?escapeHtml(latest.arm):'—'}</strong><span>Arm cm</span></div><div class="stat"><strong>${latest?.waist?escapeHtml(latest.waist):'—'}</strong><span>Waist cm</span></div></div><div class="sectionline"><h2>Add check-in</h2><span class="small">Every 2–4 weeks</span></div><div class="card"><form id="metricForm"><label class="fieldlabel" for="mdate">Date</label><input class="inputfield" id="mdate" name="date" type="date" value="${dateISO()}" required><div class="gap18"></div><div class="twocol"><div><label class="fieldlabel" for="mweight">Weight (kg)</label><input class="inputfield" type="number" id="mweight" name="weight" step="0.1" min="20" max="500" placeholder="66.8"></div><div><label class="fieldlabel" for="mwaist">Waist (cm)</label><input class="inputfield" type="number" id="mwaist" name="waist" step="0.1" min="30" max="250" placeholder="Measured at navel"></div><div><label class="fieldlabel" for="marm">Upper arm (cm)</label><input class="inputfield" type="number" id="marm" name="arm" step="0.1" min="10" max="90" placeholder="Flexed, same arm"></div><div><label class="fieldlabel" for="mhips">Hips (cm, optional)</label><input class="inputfield" type="number" id="mhips" name="hips" step="0.1" min="30" max="250" placeholder="Optional"></div></div><div class="gap18"></div><button class="btn block" type="submit">${svgIcon('plus')} Save body measurements</button></form><p class="small" style="margin:10px 0 0">Use the same measuring conditions each time. Withings body-fat estimates vary; focus on trends, strength and photos.</p></div>
<div class="sectionline"><h2>Body trends</h2></div><div class="card"><div class="row"><strong>Weight</strong><span class="metricunit">kg</span></div>${drawLineChart(sorted,'weight')}<div class="divider"></div><div class="row"><strong>Upper arm</strong><span class="metricunit">cm</span></div>${drawLineChart(sorted,'arm')}<div class="divider"></div><div class="row"><strong>Waist</strong><span class="metricunit">cm</span></div>${drawLineChart(sorted,'waist')}</div>
<div class="sectionline"><h2>Strength milestones</h2></div><div class="card"><table class="table"><thead><tr><th>Exercise</th><th>Recent</th><th>Best load</th></tr></thead><tbody>${keyIds.map(id=>`<tr><td>${EX[id].name}</td><td>${recentWeight(id)===null?'—':recentWeight(id)+' kg'}</td><td>${bestWeight(id)===null?'—':bestWeight(id)+' kg'}</td></tr>`).join('')}</tbody></table><p class="small" style="margin:12px 0 0">Best load = heaviest weight recorded in a completed set. Compare it alongside repetitions and technique, not weight alone.</p></div>
<div class="sectionline"><h2>Settings & backups</h2></div><div class="card stack"><div><label class="fieldlabel" for="startDate">Programme start date</label><input type="date" id="startDate" class="inputfield" value="${escapeHtml(data.startDate)}"><div class="small" style="margin-top:6px">Your 12-week count is based on this date.</div></div><div class="divider"></div><label class="row" style="justify-content:flex-start;cursor:pointer"><input type="checkbox" id="restSetting" ${data.settings.restTimer?'checked':''} style="accent-color:var(--lime);width:19px;height:19px"><span>Start rest timer when a set is marked done</span></label><div class="divider"></div><div class="actionrow"><button class="btn secondary tiny" data-action="backup">${svgIcon('download')} Backup JSON</button><button class="btn secondary tiny" data-action="csv">${svgIcon('download')} Export CSV</button><label class="btn secondary tiny" for="importFile" style="cursor:pointer">Import backup</label><input id="importFile" type="file" accept=".json,application/json" class="fileinput"></div><div class="notice"><strong>Private by design:</strong> Your measurements and workout logs stay in this browser's local storage; they are not uploaded. Clearing browser data can erase them. Export JSON regularly and keep a backup somewhere safe.</div></div>
${sorted.length?`<div class="sectionline"><h2>Past check-ins</h2></div>${[...sorted].reverse().map(x=>`<div class="record row"><div><strong>${formattedDate(x.date)}</strong><div class="small">${[x.weight&&x.weight+' kg',x.arm&&'Arm '+x.arm+' cm',x.waist&&'Waist '+x.waist+' cm'].filter(Boolean).join(' · ')}</div></div><button class="btn tiny ghost" data-delete-metric="${escapeHtml(x.id)}">Delete</button></div>`).join('')}`:''}`}
function renderModal(){if(!activeModal){$('#modalRoot').innerHTML='';return}const container=$('#modalRoot');let html='';if(activeModal.type==='guide'){const e=EX[activeModal.id];if(!e){activeModal=null;return}const youtube='https://www.youtube.com/results?search_query='+encodeURIComponent(e.video);html=`<div class="row start"><div class="chip">${escapeHtml(e.group)}</div><button class="mclose" data-action="close-modal" aria-label="Close">×</button></div><div class="row" style="margin:14px 0;justify-content:flex-start">${exerciseImage(activeModal.id)}<div><h2 style="margin:0">${escapeHtml(e.name)}</h2><div class="small">${escapeHtml(e.de)}</div></div></div><div class="exercise-preview" aria-label="Two exercise demonstration frames"><figure>${exerciseImage(activeModal.id,'big',0)}<figcaption>Position 1</figcaption></figure><figure>${exerciseImage(activeModal.id,'big',1)}<figcaption>Position 2</figcaption></figure></div><div class="photo-credit">Photos: <a href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener noreferrer">Free Exercise DB</a> (Unlicense). Equipment and variants may differ at Wellyou; check the instructions and video for correct form.</div><div class="labelrow">LOOK FOR THIS EQUIPMENT</div><p style="margin:7px 0 22px">${escapeHtml(e.equipment)}</p><div class="labelrow">HOW TO DO IT</div><ol style="color:#dbe4e3;line-height:1.65;padding-left:19px">${e.steps.map(x=>`<li style="padding:4px 0">${escapeHtml(x)}</li>`).join('')}</ol><div class="notice"><strong>Form tip:</strong> ${escapeHtml(e.tip)}</div><div class="gap18"></div><a class="btn block" href="${youtube}" target="_blank" rel="noopener noreferrer">${svgIcon('play')} Find a video demonstration ↗</a><p class="iosnote" style="margin:8px 0 0">Opens YouTube search results; video requires internet. Ask a gym trainer for a hands-on demonstration when needed.</p>`}
if(activeModal.type==='history'){const s=data.sessions.find(x=>x.id===activeModal.id);if(!s){activeModal=null;return}html=`<div class="row"><span class="chip">Completed session</span><button class="mclose" data-action="close-modal" aria-label="Close">×</button></div><h2>${escapeHtml(WORK[s.day]?.title||'Workout')}</h2><p class="small">${formattedDate(s.date)}</p><div class="divider"></div>${s.exercises.filter(e=>e.sets.some(x=>x.done)).map(e=>`<div style="margin-bottom:14px"><strong>${EX[e.id]?.name||e.id}</strong><div class="small">${e.sets.filter(t=>t.done).map(t=>`${t.kg===''?'Bodyweight':escapeHtml(t.kg)+' kg'} × ${escapeHtml(t.reps)}`).join(' · ')}</div></div>`).join('')}<div class="divider"></div><button class="btn danger block" data-delete-session="${escapeHtml(s.id)}">Delete this workout</button>`}
container.innerHTML=`<div class="modaloverlay" data-overlay="true"><div class="modal" role="dialog" aria-modal="true" aria-label="Exercise information">${html}</div></div>`}
const timerState={remaining:0,until:0,running:false};
function renderTimer(){const root=$('#timerRoot');if(timerState.remaining<=0){root.innerHTML='';return}if(timerState.running){timerState.remaining=Math.max(0,Math.ceil((timerState.until-Date.now())/1000))}if(timerState.remaining<=0){root.innerHTML='';return}const m=Math.floor(timerState.remaining/60),s=timerState.remaining%60;root.innerHTML=`<div class="timer" aria-live="off">${svgIcon('clock')}<span class="time">${m}:${String(s).padStart(2,'0')}</span><button aria-label="${timerState.running?'Pause':'Resume'} timer" data-action="timer-toggle">${timerState.running?'Ⅱ':'▶'}</button><button aria-label="Skip rest timer" data-action="timer-skip">×</button></div>`}
setInterval(()=>{if(timerState.running){const n=Math.max(0,Math.ceil((timerState.until-Date.now())/1000));if(n!==timerState.remaining){timerState.remaining=n;renderTimer();if(n===0&&navigator.vibrate)try{navigator.vibrate([100,80,100])}catch{}}}},500);
function toCSV(){let lines=[['Date','Workout','Exercise','Weight (kg or assistance kg)','Repetitions','Completed','Notes']];for(const s of data.sessions)for(const ex of s.exercises)for(const set of ex.sets)if(set.done)lines.push([s.date,WORK[s.day]?.title||s.day,EX[ex.id]?.name||ex.id,set.kg,set.reps,'Yes',s.notes||'']);return lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function download(name,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function importData(file){const fr=new FileReader();fr.onload=()=>{try{const imported=JSON.parse(fr.result);if(!Array.isArray(imported.sessions)||!Array.isArray(imported.measurements)||typeof imported.startDate!=='string')throw Error('Invalid workout backup');if(!confirm('Importing will replace all workout logs and measurements currently stored on this device. Continue?'))return;data={...defaultData(),...imported,settings:{...defaultData().settings,...(imported.settings||{})}};save();activeModal=null;tab='home';render();alert('Backup imported successfully.')}catch(e){alert('This file is not a valid FORM JSON backup.')}};fr.readAsText(file)}
function submitMetric(form){const vals=Object.fromEntries(new FormData(form).entries());if(!vals.weight&&!vals.waist&&!vals.arm&&!vals.hips){alert('Enter at least one measurement.');return}if(!vals.date){alert('Choose a date.');return}const entry={id:uid(),date:vals.date,weight:vals.weight||'',waist:vals.waist||'',arm:vals.arm||'',hips:vals.hips||''};data.measurements.push(entry);save();render();window.scrollTo({top:0,behavior:'smooth'})}
function handleAction(e){const btn=e.target.closest('[data-action],[data-tab],[data-goto-day],[data-select-day],[data-view-day],[data-start-day],[data-guide],[data-mark],[data-history],[data-delete-session],[data-delete-metric],[data-add-set],[data-start-custom],[data-delete-cardio],[data-delete-custom]');if(!btn){if(e.target.dataset.overlay){activeModal=null;renderModal()}return}if(btn.dataset.tab){setPage(btn.dataset.tab);return}if(btn.dataset.gotoDay){let d=btn.dataset.gotoDay;if(WORK[d]){renderDayOverview(d)}else{tab='home';alert(d==='sun'?'Sunday is your rest day.':'Optional recovery day: enjoy 20–35 minutes of easy cardio.');render()}return}if(btn.dataset.selectDay||btn.dataset.viewDay){renderDayOverview(btn.dataset.selectDay||btn.dataset.viewDay);return}if(btn.dataset.startDay){createSession(btn.dataset.startDay);return}if(btn.dataset.startCustom){const w=data.customWorkouts.find(x=>x.id===btn.dataset.startCustom);if(w){if(data.active&&!confirm('Replace your unfinished workout?'))return;data.active={id:uid(),day:'custom',title:w.name,startedAt:new Date().toISOString(),exercises:w.exercises.map((name,i)=>({id:'custom_'+i,name,sets:[{kg:'',reps:'',done:false}]})),notes:''};save();tab='train';render()}return}if(btn.dataset.deleteCardio){if(confirm('Delete this cardio entry?')){data.cardio=data.cardio.filter(x=>x.id!==btn.dataset.deleteCardio);save();render()}return}if(btn.dataset.deleteCustom){if(confirm('Delete this custom workout?')){data.customWorkouts.splice(Number(btn.dataset.deleteCustom),1);save();render()}return}if(btn.dataset.guide){activeModal={type:'guide',id:btn.dataset.guide};renderModal();return}if(btn.dataset.mark){let [i,j]=btn.dataset.mark.split(':').map(Number);updateSetCompletion(i,j);return}if(btn.dataset.addSet!==undefined){const ex=data.active?.exercises[Number(btn.dataset.addSet)];if(ex){if(ex.sets.length>=20){alert('Maximum 20 sets per exercise.');return}ex.sets.push({kg:'',reps:'',done:false});save();render()}return}if(btn.dataset.history){activeModal={type:'history',id:btn.dataset.history};renderModal();return}if(btn.dataset['deleteSession']){if(confirm('Delete this completed session permanently?')){data.sessions=data.sessions.filter(s=>s.id!==btn.dataset.deleteSession);save();activeModal=null;$('#modalRoot').innerHTML='';render()}return}if(btn.dataset['deleteMetric']){if(confirm('Delete this body measurement?')){data.measurements=data.measurements.filter(m=>m.id!==btn.dataset.deleteMetric);save();render()}return}const action=btn.dataset.action;if(action==='plan'){setPage('plan')}if(action==='finish'){finish()}if(action==='discard'){if(confirm('Discard the unfinished session and all its sets?')){data.active=null;save();timerState.running=false;timerState.remaining=0;render()}}if(action==='close-modal'){activeModal=null;$('#modalRoot').innerHTML=''}if(action==='backup'){download('form-backup-'+dateISO()+'.json',JSON.stringify(data,null,2),'application/json')}if(action==='csv'){download('form-workouts-'+dateISO()+'.csv',toCSV(),'text/csv;charset=utf-8')}if(action==='timer-toggle'){if(timerState.running){timerState.remaining=Math.max(0,Math.ceil((timerState.until-Date.now())/1000));timerState.running=false}else{timerState.running=true;timerState.until=Date.now()+timerState.remaining*1000}renderTimer()}if(action==='timer-skip'){timerState.running=false;timerState.remaining=0;renderTimer()}}
document.addEventListener('click',handleAction);
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.input&&data.active)updateSetValue(Number(t.dataset.ex),Number(t.dataset.set),t.dataset.input,t.value);if(t.id==='sessionNotes'&&data.active){data.active.notes=t.value;save()}if(t.id==='startDate'&&t.value){data.startDate=t.value;save();$('#headerWeek').textContent=`Week ${weekNumber()} of 12`}if(t.id==='restSetting'){data.settings.restTimer=t.checked;save()}});
document.addEventListener('submit',e=>{if(e.target.id==='metricForm'){e.preventDefault();submitMetric(e.target);return}if(e.target.id==='cardioForm'){e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());data.cardio=data.cardio||[];data.cardio.push({id:uid(),...v});save();render();return}if(e.target.id==='customForm'){e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());const exercises=v.exercises.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean).slice(0,40);if(!exercises.length){alert('Add at least one exercise.');return}data.customWorkouts=data.customWorkouts||[];data.customWorkouts.push({id:uid(),name:v.name.trim(),exercises});save();render();return}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files?.[0])importData(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeModal){activeModal=null;renderModal()}});
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
